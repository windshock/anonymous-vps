name: Weekly Provider Discovery

on:
  schedule:
    - cron: '15 2 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_providers.py'
      - 'data/discovery-sources.yml'
      - '.github/workflows/discover-providers.yml'

permissions:
  contents: write

concurrency:
  group: anonymous-vps-data-refresh
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test discovery
        run: python3 -m unittest discover -s tests -p 'test_discovery.py' -v
      - name: Discover provider candidates
        run: python3 scripts/discover_providers.py
      - name: Commit candidate updates directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/candidates/providers.json
          if git diff --cached --quiet; then
            echo "No new provider candidates."
            exit 0
          fi
          UPDATED_AT=$(date -u +"%Y-%m-%d")
          git commit -m "chore: refresh provider discovery $UPDATED_AT"
          git pull --rebase origin main
          git push origin HEAD:main
