name: Weekly Detection Data Refresh

on:
  schedule:
    - cron: '17 0 * * 1'   # every Monday at 00:17 UTC (09:17 KST)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/providers.yml'
      - 'data/asns.yml'
      - 'data/cidrs.yml'
      - 'data/incidents/**'
      - 'scripts/fetch_asn.py'
      - 'scripts/generate_*.py'
      - 'scripts/pipeline.py'
      - '.github/workflows/update-asn.yml'

permissions:
  contents: write

concurrency:
  group: anonymous-vps-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest ASN and country DB
        run: python3 scripts/fetch_asn.py

      - name: Rebuild generated data
        run: python3 scripts/pipeline.py --skip-fetch

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/ip-ranges/known-providers.csv \
            data/vps-providers.csv \
            generated/detection/ \
            generated/legacy/ \
            generated/context/ \
            queries/logpresso/ \
            queries/sigma/

          if git diff --cached --quiet; then
            echo "No generated-data changes."
            exit 0
          fi

          UPDATED_AT=$(date -u +"%Y-%m-%d")
          git commit -m "chore: refresh detection data $UPDATED_AT"
          git pull --rebase origin main
          git push origin HEAD:main
